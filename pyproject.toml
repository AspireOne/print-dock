[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "printdock-cli"
version = "0.1.0"
description = "Bluetooth CLI for Polaroid Hi-Print on Windows, macOS, and Linux"
requires-python = ">=3.12"
dependencies = ["bleak>=3.1,<4", "Pillow>=12,<13"]

[project.scripts]
printdock = "printdock.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["python/printdock"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
